<script>
// ─── HELPERS ───────────────────────────────────────────────────────────────
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function highlight(text, query){
  if(!query) return esc(text);
  const escaped = esc(text);
  const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return escaped.replace(regex, '<mark>$1</mark>');
}

// Normalize text for matching: lowercase, & → space, collapse spaces
function norm(s){
  return (s||'').toLowerCase().replace(/&/g,' ').replace(/\s+/g,' ').trim();
}

// Score a match: higher = more relevant
// Name match scores higher than keyword-only match
function scoreMatch(row, q){
  const nameNorm = norm(row['Category Name (English)'] || row['keywords'] || '');
  const kwNorm   = norm(row['English Keyword'] || '');
  const fullNorm = norm([
    row['LNC ID']||'', row['Category Name (English)']||'', row['Category Name (中文)']||'',
    row['English Keyword']||'', row['Reminder']||'',
    // compilation fields
    row['keywords']||'', (row['best']||[]).join(' '), (row['acceptable']||[]).join(' '), row['notes']||'',
    // audit fields
    row['user_category']||'', row['reviewer_category']||'', row['lesson']||'', row['sz_feedback']||'', row['error_type']||''
  ].join(' '));

  if(!fullNorm.includes(q)) return -1;

  let score = 1;
  if(nameNorm.includes(q)) score += 10;
  if(nameNorm.startsWith(q)) score += 5;
  if(kwNorm.includes(q)) score += 3;
  // for audit: boost if category name matches
  const auditCatNorm = norm((row['user_category']||'') + ' ' + (row['reviewer_category']||''));
  if(auditCatNorm.includes(q)) score += 8;
  const wordBound = new RegExp('(^| )' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '( |$)');
  if(wordBound.test(nameNorm)) score += 4;

  return score;
}

// ─── BUILD ALL ITEMS ───────────────────────────────────────────────────────
const output      = document.getElementById('output');
const compOutput  = document.getElementById('compOutput');
const compSection = document.getElementById('compSection');
const compCount   = document.getElementById('compCount');
const noResults   = document.getElementById('noResults');
const resultsBox  = document.getElementById('searchResults');
const clearBtn    = document.getElementById('clearBtn');
const resultCount = document.getElementById('resultCount');
const searchBox   = document.getElementById('searchBox');

let catItems  = [];
let compItems = [];
let auditItems = [];

const auditOutput = document.getElementById('auditOutput');
const auditCount  = document.getElementById('auditCount');
const auditHeader = document.getElementById('auditHeader');

// ─── CATEGORY CARD HTML ───────────────────────────────────────────────────
function catCardHTML(row, query){
  const id  = row['LNC ID'] || '';
  const en  = row['Category Name (English)'] || '';
  const zh  = row['Category Name (中文)'] || '';
  const kw  = row['English Keyword'] || '';
  const rem = (row['Reminder'] || '').trim();

  const reminderBlock = rem ? `
    <div class="reminder-box">
      <div class="reminder-label">⚠ Additional Notes</div>
      <div class="reminder-text">${highlight(rem, query)}</div>
    </div>` : '';

  return `
    <div class="card-lncid">LNCID: <span>${esc(id)}</span></div>
    <div class="card-name">${highlight(en, query)}</div>
    <div class="card-name-zh">${esc(zh)}</div>
    <div class="card-kw-label">English Keywords</div>
    <div class="card-kw">${highlight(kw, query)}</div>
    ${reminderBlock}
  `;
}

// ─── COMPILATION CARD HTML ────────────────────────────────────────────────
function compCardHTML(row, query){
  const bestList = (row.best||[]).map(b =>
    `<li>${highlight(b, query)}</li>`).join('');
  const acceptList = (row.acceptable||[]).map(a =>
    `<li>${highlight(a, query)}</li>`).join('');

  const bestBlock = bestList ? `
    <span class="comp-section-label best">✓ Best Category</span>
    <ul class="comp-list best-list">${bestList}</ul>` : '';

  const acceptBlock = acceptList ? `
    <span class="comp-section-label acceptable">◎ Acceptable</span>
    <ul class="comp-list acceptable-list">${acceptList}</ul>` : '';

  const notesBlock = row.notes ? `
    <div class="comp-notes">
      <span class="comp-section-label notes-label">★ Note</span>
      <div class="comp-notes-text">${highlight(row.notes, query)}</div>
    </div>` : '';

  return `
    <div class="comp-left">
      <span class="comp-badge">Product Type</span>
      <div class="comp-keyword">${highlight(row.keywords, query)}</div>
    </div>
    <div class="comp-right">
      ${bestBlock}
      ${acceptBlock}
      ${notesBlock}
    </div>
  `;
}

// ─── AUDIT CARD HTML ─────────────────────────────────────────────────────
function auditCardHTML(row, query){
  const isDeboosted = (row.error_type||'').toLowerCase().includes('deboost');
  const typeLabel   = isDeboosted ? 'Wrongly Deboosted' : 'Wrongly Passed';
  const typeClass   = isDeboosted ? 'deboosted' : 'passed';

  const catLine = (row.user_category && row.reviewer_category)
    ? `<div class="audit-cats">
        <span class="cat-from">${highlight(row.user_category, query)}</span>
        <span class="cat-arrow">→</span>
        <span class="cat-to">${highlight(row.reviewer_category, query)}</span>
       </div>`
    : row.user_category
      ? `<div class="audit-cats"><span class="cat-from">${highlight(row.user_category, query)}</span></div>`
      : '';

  const feedbackBlock = row.sz_feedback
    ? `<div class="audit-feedback">
        <span class="audit-fb-label">💬 Shopee Feedback</span>
        ${highlight(row.sz_feedback, query)}
       </div>` : '';

  return `
    <div class="audit-top">
      <span class="audit-type ${typeClass}">${esc(typeLabel)}</span>
      ${catLine}
    </div>
    <div class="audit-lesson">${highlight(row.lesson, query)}</div>
    ${feedbackBlock}
  `;
}

// ─── BUILD DOM ────────────────────────────────────────────────────────────
function buildAll(){
  output.innerHTML = '';
  compOutput.innerHTML = '';
  auditOutput.innerHTML = '';
  catItems   = [];
  compItems  = [];
  auditItems = [];

  ckData.forEach(row => {
    const hasReminder = (row['Reminder']||'').trim().length > 0;
    const el = document.createElement('div');
    el.className = 'data-card' + (hasReminder ? ' has-reminder' : '');
    el.dataset.type = 'category';
    el.dataset.id   = row['LNC ID'];
    el.dataset.row  = JSON.stringify(row);
    el.innerHTML = catCardHTML(row, '');
    output.appendChild(el);
    catItems.push({ el, row, type:'category' });
  });

  compilationData.forEach(row => {
    const el = document.createElement('div');
    el.className = 'comp-card';
    el.dataset.type = 'compilation';
    el.dataset.id   = 'comp-' + row.keywords.slice(0, 30);
    el.dataset.row  = JSON.stringify(row);
    el.innerHTML = compCardHTML(row, '');
    compOutput.appendChild(el);
    compItems.push({ el, row, type:'compilation' });
  });

  // Audit cases
  auditData.forEach((row, i) => {
    const el = document.createElement('div');
    el.className = 'audit-card';
    el.dataset.type = 'audit';
    el.dataset.id   = 'audit-' + i;
    el.dataset.row  = JSON.stringify(row);
    el.innerHTML = auditCardHTML(row, '');
    auditOutput.appendChild(el);
    auditItems.push({ el, row, type:'audit' });
  });

  compCount.textContent  = `${compilationData.length} entries`;
  auditCount.textContent = `${auditData.length} cases`;
}

// ─── SEARCH ───────────────────────────────────────────────────────────────
let currentQuery = '';

searchBox.addEventListener('input', function(){
  currentQuery = this.value.trim();
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  runSearch(currentQuery);
});

clearBtn.addEventListener('click', function(){
  searchBox.value = ''; currentQuery = '';
  clearBtn.style.display = 'none';
  resultsBox.style.display = 'none';
  resultCount.textContent = '';
  noResults.style.display = 'none';
  resetAll();
  searchBox.focus();
});

function runSearch(query){
  const q = norm(query);

  if(q.length < 2){
    resultsBox.style.display = 'none';
    resultCount.textContent = '';
    resetAll();
    return;
  }

  // ── Category cards ──
  const scoredCats = [];
  catItems.forEach(item => {
    const s = scoreMatch(item.row, q);
    item.el.style.display = 'none';
    if(s >= 0) scoredCats.push({ ...item, score: s });
  });
  scoredCats.sort((a, b) => b.score - a.score);
  scoredCats.forEach(item => {
    const row = JSON.parse(item.el.dataset.row);
    item.el.innerHTML = catCardHTML(row, query);
    item.el.style.display = '';
    output.appendChild(item.el);
  });

  // ── Compilation cards ──
  const scoredComp = [];
  compItems.forEach(item => {
    const s = scoreMatch(item.row, q);
    item.el.style.display = 'none';
    if(s >= 0) scoredComp.push({ ...item, score: s });
  });
  scoredComp.sort((a, b) => b.score - a.score);
  scoredComp.forEach(item => {
    const row = JSON.parse(item.el.dataset.row);
    item.el.innerHTML = compCardHTML(row, query);
    item.el.style.display = '';
    compOutput.appendChild(item.el);
  });

  // ── Audit cards ──
  const scoredAudit = [];
  auditItems.forEach(item => {
    const s = scoreMatch(item.row, q);
    item.el.style.display = 'none';
    if(s >= 0) scoredAudit.push({ ...item, score: s });
  });
  scoredAudit.sort((a, b) => b.score - a.score);
  scoredAudit.forEach(item => {
    const row = JSON.parse(item.el.dataset.row);
    item.el.innerHTML = auditCardHTML(row, query);
    item.el.style.display = '';
    auditOutput.appendChild(item.el);
  });

  const catVisible   = scoredCats.length;
  const compVisible  = scoredComp.length;
  const auditVisible = scoredAudit.length;
  const total = catVisible + compVisible + auditVisible;

  resultCount.textContent = total === 0
    ? 'No results found.'
    : `${catVisible} categor${catVisible===1?'y':'ies'} · ${compVisible} product type${compVisible===1?'':'s'} · ${auditVisible} audit case${auditVisible===1?'':'s'} found`;

  noResults.style.display = total === 0 ? 'flex' : 'none';
  if(total === 0) noResults.innerHTML = `<span>🔍</span>No results for "<b>${esc(query)}</b>".<br>Try a different keyword or LNCID.`;

  compCount.textContent  = compVisible  > 0 ? `${compVisible} match${compVisible===1?'':'es'}`   : `${compilationData.length} entries`;
  auditCount.textContent = auditVisible > 0 ? `${auditVisible} match${auditVisible===1?'':'es'}` : `${auditData.length} cases`;

  const dropItems = [
    ...scoredCats.slice(0, 5),
    ...scoredComp.slice(0, 2),
    ...scoredAudit.slice(0, 2)
  ];
  renderDropdown(dropItems, query);
}

function resetAll(){
  buildAll();
}

// ─── DROPDOWN ─────────────────────────────────────────────────────────────
function renderDropdown(items, query){
  if(!items.length){ resultsBox.style.display = 'none'; return; }

  resultsBox.innerHTML = items.map(item => {
    if(item.type === 'category'){
      const row = item.row;
      return `<div class="result-item" data-id="${esc(row['LNC ID'])}" data-type="category">
        <div class="result-id">LNCID: ${esc(row['LNC ID'])}</div>
        <div class="result-category">${highlight(row['Category Name (English)'], query)}</div>
      </div>`;
    } else if(item.type === 'compilation'){
      const row = item.row;
      return `<div class="result-item result-compilation" data-id="${esc('comp-'+row.keywords.slice(0,20))}" data-type="compilation">
        <div class="result-id">📋 Product Type</div>
        <div class="result-category">${highlight(row.keywords, query)}</div>
      </div>`;
    } else {
      const row = item.row;
      const isDeboosted = (row.error_type||'').toLowerCase().includes('deboost');
      return `<div class="result-item result-compilation" data-id="${esc(item.el.dataset.id)}" data-type="audit">
        <div class="result-id">${isDeboosted ? '⚠️ Wrongly Deboosted' : '⚠️ Wrongly Passed'}</div>
        <div class="result-category">${highlight(row.user_category || row.lesson.slice(0,60), query)}</div>
      </div>`;
    }
  }).join('');
  resultsBox.style.display = 'block';
}

resultsBox.addEventListener('click', function(e){
  const item = e.target.closest('.result-item');
  if(!item) return;

  const id   = item.dataset.id;
  const type = item.dataset.type;
  const pool = type === 'compilation' ? compItems
             : type === 'audit'       ? auditItems
             :                          catItems;
  const target = pool.find(i => i.el.dataset.id === id);
  if(!target || target.el.style.display === 'none') return;

  resultsBox.style.display = 'none';
  searchBox.blur();

  target.el.scrollIntoView({ behavior:'smooth', block:'center' });

  setTimeout(() => {
    let count = 0;
    function pulse(){
      if(count >= 3) return;
      target.el.classList.remove('active-highlight');
      void target.el.offsetWidth;
      target.el.classList.add('active-highlight');
      count++;
      setTimeout(pulse, 700);
    }
    pulse();
  }, 350);
});

document.addEventListener('click', function(e){
  if(!e.target.closest('.search-wrap')) resultsBox.style.display = 'none';
});
searchBox.addEventListener('focus', function(){
  if(currentQuery.length >= 2) resultsBox.style.display = 'block';
});

// ─── THEME TOGGLE ─────────────────────────────────────────────────────────
const themeBtn = document.getElementById('themeBtn');

function applyTheme(light){
  if(light){
    document.body.classList.add('light');
    themeBtn.textContent = '🌙';
    themeBtn.title = 'Switch to dark mode';
  } else {
    document.body.classList.remove('light');
    themeBtn.textContent = '☀️';
    themeBtn.title = 'Switch to light mode';
  }
}

// Restore saved preference
const savedTheme = localStorage.getItem('sz-theme');
applyTheme(savedTheme === 'light');

themeBtn.addEventListener('click', function(){
  const isLight = document.body.classList.contains('light');
  applyTheme(!isLight);
  localStorage.setItem('sz-theme', !isLight ? 'light' : 'dark');
});

// ─── INIT ─────────────────────────────────────────────────────────────────
buildAll();
showToast(`✓ ${ckData.length.toLocaleString()} categories · ${compilationData.length} product types · ${auditData.length} audit cases loaded`, 'success');
</script>
</body>
</html>
